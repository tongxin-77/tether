[package]
name = "tetherd"
version = "0.5.5"
license = "Apache-2.0"
description = "Tether 后台进程：持有全部终端会话，GUI 通过命名管道接入"
edition = "2024"

[dependencies]
proto = { path = "../proto" }
portable-pty = "0.9"
vt100 = "0.18.1"
tauri-winrt-notification = "0.8.1"
winreg = "0.56"
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "sync", "time", "macros", "fs"] }
# SSH 客户端：纯 Rust；不用默认的 aws-lc-rs 后端（Windows 上需 cmake/nasm），改用 ring
russh = { version = "0.65.1", default-features = false, features = ["ring", "rsa", "flate2"] }
# 文件树的远程后端：在已有 SSH 连接上开 sftp 子系统（不依赖 russh 本身，基于 channel stream）
russh-sftp = "3.0.1"
# 保存 SSH 密码到 Windows 凭据管理器（v1 特性在 Windows 上只启用 windows-native 后端）
keyring = "4.2.0"
# 管理服务器（hub）客户端：WebSocket 只用握手 / 帧编解码（不启用自带的 connect 与 TLS 集成），TCP / TLS 由 hub 模块自己建立，
# 以便按 DNS / TCP / TLS / 握手分阶段报错。TLS 用 rustls + ring（同 russh，避开 aws-lc-rs），根证书取 Windows 证书库
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# hub 协议的 machine-id（UUID v4）
uuid = { version = "1.29.2", features = ["v4"] }
# 保持进程 MTA（CoIncrementMTAUsage，见 notify.rs）、播放提示音（PlaySoundW）与崩溃日志（SetUnhandledExceptionFilter，见 crash.rs）；
# 主机信息卡片的本机采样（GetSystemTimes / GlobalMemoryStatusEx / GetIfTable2 / PDH，见 stats.rs）
# 会话进程树内存（CreateToolhelp32Snapshot / GetProcessMemoryInfo，见 memory.rs）
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Performance", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus"] }

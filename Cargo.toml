# Cargo workspace：GUI（src-tauri）+ 后台进程（daemon）+ 共享协议类型（proto）
# 产物统一输出到根目录 target/，GUI 与 daemon 同目录，便于互相拉起
[workspace]
members = ["src-tauri", "daemon", "proto"]
resolver = "3"

# profile 只在 workspace 根生效，从 src-tauri/Cargo.toml 迁移至此
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# 开发版：图片编解码相关依赖开启优化，否则 Ctrl+V 贴图的 PNG 编码在 debug 下慢一个数量级（不影响 release）
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
